# 纯 WebView 壳 iOS 未签名 IPA（macOS runner + Capacitor 7）
name: Build iOS
run-name: app-builder:${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: U-Station build record id
        required: false
      target_url:
        description: H5 target URL
        required: true
      bundle_id:
        description: iOS bundle identifier
        required: true
      app_name:
        description: App display name (ASCII fallback)
        required: true
      app_name_b64:
        description: UTF-8 display name base64
        required: false
      version_name:
        description: CFBundleShortVersionString
        required: true
      version_code:
        description: CFBundleVersion
        required: true
      platform_url:
        description: U-Station API base (assets)
        required: true
      icon_url:
        description: optional icon path/url
        required: false
      splash_url:
        description: optional splash path/url
        required: false
      square_icon_url:
        description: optional square icon
        required: false
      callback_token:
        description: platform callback token
        required: true
      splash_enabled:
        description: Show the startup splash image
        required: false
        default: "true"
      min_sdk:
        required: false
        default: "24"
      target_sdk:
        required: false
        default: "36"
      compile_sdk:
        required: false
        default: "36"
      fix_apk:
        required: false
        default: "true"
      sign_v1:
        required: false
        default: "true"
      sign_v2:
        required: false
        default: "true"
      sign_v3:
        required: false
        default: "true"
      verify_apk:
        required: false
        default: "true"
      check_production:
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      SPLASH_ENABLED: ${{ inputs.splash_enabled }}
      APP_BUILDER_MIN_SDK: ${{ inputs.min_sdk }}
      APP_BUILDER_TARGET_SDK: ${{ inputs.target_sdk }}
      APP_BUILDER_COMPILE_SDK: ${{ inputs.compile_sdk }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          node scripts/ensure-www.mjs
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Apply build config & assets
        env:
          TARGET_URL: ${{ inputs.target_url }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          APP_NAME: ${{ inputs.app_name }}
          APP_NAME_B64: ${{ inputs.app_name_b64 }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          PLATFORM_URL: ${{ inputs.platform_url }}
          ICON_URL: ${{ inputs.icon_url }}
          SPLASH_URL: ${{ inputs.splash_url }}
          SQUARE_ICON_URL: ${{ inputs.square_icon_url }}
        run: |
          node scripts/apply-build-config.mjs
          python3 -m venv "$RUNNER_TEMP/appbuilder-ios-assets"
          python_bin="$RUNNER_TEMP/appbuilder-ios-assets/bin/python"
          "$python_bin" -m pip install --quiet Pillow
          PYTHON_BIN="$python_bin" node scripts/download-assets.mjs

      - name: Capacitor add iOS
        env:
          TARGET_URL: ${{ inputs.target_url }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          APP_NAME: ${{ inputs.app_name }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          npm ls @capacitor/ios >/dev/null 2>&1 || npm install @capacitor/core@7.2.0 @capacitor/ios@7.2.0 --no-save
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          test -d ios/App

      - name: Apply iOS app icon & launch image
        run: |
          "$RUNNER_TEMP/appbuilder-ios-assets/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          from PIL import Image, ImageOps

          app = Path("ios/App/App")
          assets = app / "Assets.xcassets"
          source = Path("resources")

          def write_asset(folder, filename, properties):
              catalog = assets / folder / "Contents.json"
              contents = json.loads(catalog.read_text(encoding="utf-8"))
              contents["images"] = [{"idiom": "universal", "filename": filename, **properties}]
              catalog.write_text(json.dumps(contents, indent=2) + "\n", encoding="utf-8")
              return catalog.with_name(filename)

          icon_path = source / "icon.png"
          if icon_path.is_file():
              with Image.open(icon_path) as icon:
                  if min(icon.size) >= 48:
                      icon = ImageOps.pad(icon.convert("RGBA"), (1024, 1024), Image.Resampling.LANCZOS)
                      opaque = Image.alpha_composite(Image.new("RGBA", icon.size, "white"), icon).convert("RGB")
                      opaque.save(write_asset("AppIcon.appiconset", "AppBuilderIcon.png",
                                              {"platform": "ios", "size": "1024x1024"}))
                      print("iOS assets: applied AppIcon (1024x1024)")

          storyboard = app / "Base.lproj" / "LaunchScreen.storyboard"
          launch = ET.parse(storyboard)
          view = launch.find('.//imageView[@image="Splash"]')
          image_entry = launch.find('./resources/image[@name="Splash"]')
          if view is None or image_entry is None:
              raise RuntimeError("Capacitor launch screen does not reference the Splash asset")

          if os.environ.get("SPLASH_ENABLED") == "false":
              view.attrib.pop("image")
              launch.find("./resources").remove(image_entry)
              print("iOS assets: launch image disabled")
          elif (source / "splash.png").is_file():
              with Image.open(source / "splash.png") as splash:
                  if min(splash.size) >= 2:
                      splash = splash.convert("RGBA")
                      splash.save(write_asset("Splash.imageset", "AppBuilderLaunch.png", {"scale": "1x"}))
                      view.set("contentMode", "scaleAspectFit")
                      image_entry.set("width", str(splash.width))
                      image_entry.set("height", str(splash.height))
                      red, green, blue, alpha = splash.getpixel((0, 0))
                      background = view.find('./color[@key="backgroundColor"]')
                      if background is not None:
                          background.attrib.clear()
                          background.attrib.update(key="backgroundColor", alpha="1", colorSpace="custom",
                                                   customColorSpace="sRGB", red=str(red * alpha / 65025),
                                                   green=str(green * alpha / 65025), blue=str(blue * alpha / 65025))
                      print(f"iOS assets: applied Splash ({splash.width}x{splash.height}, aspect fit)")
          launch.write(storyboard, encoding="UTF-8", xml_declaration=True)
          PY

      - name: Verify iOS shell
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: node scripts/verify-ios-build.mjs

      - name: Build unsigned IPA
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: bash ios-build.sh

      - name: Verify IPA artifact
        run: |
          test -f app-ios.ipa
          ls -la app-ios.ipa
          unzip -l app-ios.ipa | head -20

      - name: Collect IPA
        id: ipa
        run: |
          test -f app-ios.ipa
          echo "path=app-ios.ipa" >> "$GITHUB_OUTPUT"
          echo "name=$(basename app-ios.ipa)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -f%z app-ios.ipa)" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-v${{ inputs.version_name }}-${{ github.run_number }}
          name: iOS v${{ inputs.version_name }} (${{ github.run_number }})
          files: ${{ steps.ipa.outputs.path }}
          generate_release_notes: false

      - name: Upload IPA to platform (public download)
        if: success() && inputs.callback_token != ''
        env:
          PLATFORM_URL: ${{ inputs.platform_url }}
          CALLBACK_TOKEN: ${{ inputs.callback_token }}
          BUILD_ID: ${{ inputs.build_id }}
          BUILD_PLATFORM: ios
          VERSION_NAME: ${{ inputs.version_name }}
          RELEASE_TAG: ios-v${{ inputs.version_name }}-${{ github.run_number }}
          APK_PATH: ${{ steps.ipa.outputs.path }}
        run: node scripts/upload-apk-to-platform.mjs || echo "platform upload failed (non-fatal, use GitHub Release)"

      - name: Notify platform (success)
        if: success()
        env:
          PLATFORM_URL: ${{ inputs.platform_url }}
          CALLBACK_TOKEN: ${{ inputs.callback_token }}
          BUILD_ID: ${{ inputs.build_id }}
          BUILD_PLATFORM: ios
          BUILD_STATUS: success
          RELEASE_TAG: ios-v${{ inputs.version_name }}-${{ github.run_number }}
          DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/ios-v${{ inputs.version_name }}-${{ github.run_number }}/${{ steps.ipa.outputs.name }}
          FILE_SIZE_BYTES: ${{ steps.ipa.outputs.size }}
        run: node scripts/notify-platform.mjs || true

      - name: Notify platform (failure)
        if: failure()
        env:
          PLATFORM_URL: ${{ inputs.platform_url }}
          CALLBACK_TOKEN: ${{ inputs.callback_token }}
          BUILD_ID: ${{ inputs.build_id }}
          BUILD_PLATFORM: ios
          BUILD_STATUS: failed
          BUILD_ERROR: iOS workflow failed
        run: node scripts/notify-platform.mjs || true
